# Thresholds for benchmark summaries and recommendations. These are named
# heuristics, not calibrated models; every output that uses one cites its rule.
version: 1

weave_verdict:
  rule: weave-verdict-v2
  # Judged separately for Raptor Strikes on the boss and on every other hostile
  # NPC (adds, start trash, pulled-in trash).
  # yes: at least `share` of the known same-faction entries cast `heavy_raptors`
  # or more Raptor Strikes on that role; opportunistic: at least `share` cast one
  # or more; otherwise no. Fewer than `min_known` known entries -> unknown.
  share: 0.5
  heavy_raptors: 5
  min_known: 3

raid_speed:
  rule: raid-speed-v2
  # Basis: the same-faction median kill time when at least 3 kill times are
  # known; flag at `ratio` or more. Otherwise the fastest same-faction kill,
  # flagged at `fallback_ratio` or more. Both comparisons are always reported.
  ratio: 1.5
  fallback_ratio: 2.0

recommendations:
  rule_set: recommendations-v1
  build_share: 0.5          # dominant talent build shared by at least this many
  darkmoon_share: 0.5
  trinket_share: 0.5
  explosive_share: 0.5
  rapid_fire_share: 0.5
  aimed_shortfall: 0.10     # Aimed/min more than 10% below the median
  pet_dps_ratio: 0.75       # Hunter-pet DPS below 75% of the median
  pet_stop_early_s: 3.0     # last pet damage more than 3 s before the kill
  foreign_share_pct: 25.0   # cohort median foreign-target share for "padding"
  subject_foreign_max_pct: 5.0

playbook:
  rule_set: playbook-v1
  # An other-faction entry counts as a "melee package" (context, not a benchmark)
  # when Windfury was confirmed or it swung in melee at least this often.
  melee_package_min_swings: 5
  heavy_raptors: 5
  opener_casts: 8
  pet_stop_early_s: 3.0
  # Cohort median share of damage to non-encounter targets that marks padded parses.
  padding_share_pct: 25.0

# Live cohort selection from WCL characterRankings pages (rule set live-cohort-v1).
# `metadata` counts every selected same-faction row, the `deep` ones included.
live_cohort:
  rule_set: live-cohort-v1
  deep: 5
  metadata: 25
  min_same_faction: 3
  max_pages: 10
  # Ranking rows carry no character faction, only the guild's `faction` number.
  # Checked against the recorded Naxxramas fixture (faction from combatant info):
  # 0 matched Alliance 36/36 and 1 matched Horde 7/7, no contradictions; 31 of 75
  # rows had no guild. A guild's faction is not the character's own record, so the
  # rule only ever gives INFERRED, and an observed check overrides it.
  guild_faction:
    rule: guild-faction-v1
    map: {0: Alliance, 1: Horde}
    verified: "recorded fixture 2026-10-13: 0=Alliance 36/36, 1=Horde 7/7, 0 contradictions"

# Which of the subject's ranked kills is "the subject's fight" for a boss in live mode.
# Highest amount (DPS); ties: higher rankPercent, then earlier startTime (a missing
# field sorts after a present one), then report code and fight id. On the recorded
# Naxxramas fixture this reproduces the export's chosen subject fight on 15 of 15
# bosses; ordering by rankPercent first would pick a different Patchwerk kill.
subject_fight:
  rule: subject-fight-v1
