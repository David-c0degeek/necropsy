version: 1
rule: aq40-encounter-facts-v1
retrieved: '2026-10-17'
encounters:
- id: 50709
  name: The Prophet Skeram
  source: https://raw.githubusercontent.com/DeadlyBossMods/DBM-Vanilla/efc7ed4e3f448b783296758e31f37bd3a46cabaf/DBM-Raids-Vanilla/AQ40/Skeram.lua
  note: True Fulfillment (785), Summon Images (747) and Arcane Explosion (26192) are distinct mechanics. Same-name
    NPCs do not establish original/image identity or ranking eligibility.
  timings:
  - key: split-coverage
    text: Allocate platform pickups, interrupts and controlled-player containment before the pull.
  - key: control-recovery
    text: A controlled player changes raid safety needs; a nominal charm duration is not an observed control window.
- id: 50710
  name: Silithid Royalty
  source: https://raw.githubusercontent.com/DeadlyBossMods/DBM-Vanilla/efc7ed4e3f448b783296758e31f37bd3a46cabaf/DBM-Raids-Vanilla/AQ40/ThreeBugs.lua
  note: Kri (15511), Yauj (15543) and Vem (15544) have distinct duties and death effects. Great Heal (25807), Fear
    (26580) and Toxic Volley (25812) are separate mechanics.
  timings:
  - key: kill-order
    text: The chosen last survivor changes encounter work; do not infer a universal kill order from an aggregate
      damage ranking.
  - key: poison-recovery
    text: Toxic Volley has Poison dispel metadata; poison damage school alone does not establish removal capability.
- id: 50711
  name: Battleguard Sartura
  source: https://raw.githubusercontent.com/DeadlyBossMods/DBM-Vanilla/efc7ed4e3f448b783296758e31f37bd3a46cabaf/DBM-Raids-Vanilla/AQ40/Sartura.lua
  note: Sartura (15516) and Royal Guard (15984) require separate instance identity. Whirlwind (26083) and Enrage
    (8269) are not interchangeable aura states.
  timings:
  - key: guard-control
    text: Guard separation and recovery after roaming or knockbacks are distinct from boss damage uptime.
  - key: whirlwind-safety
    text: Whirlwind exposure does not establish avoidability, position or the duty assigned to a melee player.
- id: 50712
  name: Fankriss the Unyielding
  source: https://raw.githubusercontent.com/DeadlyBossMods/DBM-Vanilla/efc7ed4e3f448b783296758e31f37bd3a46cabaf/DBM-Raids-Vanilla/AQ40/Fankriss.lua
  note: Mortal Wound (25646), Entangle (720/731/1121) and worm summons (518/25831/25832) need separate recipients
    and targets. Nominal addon stack warnings do not define universal swap failure.
  timings:
  - key: spawn-priority
    text: Dangerous worm spawns and tunnel drones have different assignments; off-boss damage alone is not padding.
  - key: entangle-recovery
    text: Entangled players may need dedicated healing and add pickup, independent of the main tank wound state.
- id: 50713
  name: Viscidus
  source: https://raw.githubusercontent.com/DeadlyBossMods/DBM-Vanilla/efc7ed4e3f448b783296758e31f37bd3a46cabaf/DBM-Raids-Vanilla/AQ40/Viscidus.lua
  note: Poison Bolt Volley (25991), Rejoin Viscidus (25896) and Frost Weakness (25926) are distinct. The addon frost
    counter and emotes are not a complete raw phase contract.
  timings:
  - key: freeze-shatter
    text: Frost-hit, shatter and glob work differ from ordinary throughput; nominal hit counts cannot certify observed
      phase boundaries.
  - key: rejoin
    text: Frost Weakness can occur after rejoining and is not alone proof of a complete frozen window.
- id: 50714
  name: Princess Huhuran
  source: https://raw.githubusercontent.com/DeadlyBossMods/DBM-Vanilla/efc7ed4e3f448b783296758e31f37bd3a46cabaf/DBM-Raids-Vanilla/AQ40/Huhuran.lua
  note: Frenzy (26051), Berserk (26068), Wyvern Sting (26180), Noxious Poison (26053) and Acid Spit (26050) are
    distinct. A poison-themed name is not ordinary Poison dispel metadata.
  timings:
  - key: frenzy-removal
    text: Hunter Tranquilizing Shot attempts Frenzy removal; it does not certify removal of the separate Berserk.
  - key: sting-recovery
    text: Wyvern Sting removal can cause damage. Assigned tank recovery is different from indiscriminate raid cleansing.
- id: 50715
  name: Twin Emperors
  source: https://raw.githubusercontent.com/DeadlyBossMods/DBM-Vanilla/efc7ed4e3f448b783296758e31f37bd3a46cabaf/DBM-Raids-Vanilla/AQ40/TwinEmps.lua
  note: Veknilash (15275) and Veklor (15276) retain separate targets despite shared health. Twin Teleport (799/800),
    Unbalancing Strike (26613), Mutate Bug (802) and Explode Bug (804) are distinct.
  timings:
  - key: target-eligibility
    text: Veklor resists physical attacks; Veknilash has magic immunities with a Holy exception. Verify the actual
      ability and target, not the class label alone.
  - key: teleport-handoff
    text: Teleport recovery changes tank and healing duties. Addon timers cannot define observed safe attack windows.
- id: 50716
  name: Ouro
  source: https://raw.githubusercontent.com/DeadlyBossMods/DBM-Vanilla/efc7ed4e3f448b783296758e31f37bd3a46cabaf/DBM-Raids-Vanilla/AQ40/Ouro.lua
  note: Sand Blast is 26102; Sweep is 26103. Summon Ouro Mounds (26058) is not literally a Burrow aura. Generic
    Birth (26586) requires caster identity before use as an emergence marker.
  timings:
  - key: threat-recovery
    text: Sand Blast and Sweep create distinct threat and position recovery work; static timers do not certify physical
      opportunity.
  - key: ground-hazards
    text: Mounds, emergence and scarabs change movement and target duties; a gap in player casts does not prove
      burrow downtime.
- id: 50717
  name: C'Thun
  source: https://raw.githubusercontent.com/DeadlyBossMods/DBM-Vanilla/efc7ed4e3f448b783296758e31f37bd3a46cabaf/DBM-Raids-Vanilla/AQ40/CThun.lua
  note: Eye (15589), body (15727) and tentacle instances are distinct targets. Eye Beam (26134), Dark Glare (26029),
    Digestive Acid (26476) and vulnerability (26235) require separate evidence.
  timings:
  - key: eye-body
    text: Eye/body changes and tentacle work need exact NPC identities, not a total encounter damage sum.
  - key: stomach
    text: Digestive Acid is recipient exposure context, not proof of complete stomach position, attackability or
      safe residence.
