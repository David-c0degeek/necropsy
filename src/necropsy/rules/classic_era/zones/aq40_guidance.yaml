version: 1
rule: aq40-execution-v1
non_boss_share_min_pct: 5.0
general:
- key: one-rapid-fire
  when: kill_within_rapid_fire_cooldown
  text: 'With no cooldown reset, this kill is shorter than Rapid Fire''s cooldown,
    so it allows one use: spend it where it covers the most ranked damage.'
  otherwise: 'This kill is longer than Rapid Fire''s cooldown: a pull use comes back
    before the end, so a second use is possible.'
  based_on:
  - rapid_fire
- key: refocus-after-specials
  text: Refocus clears the cooldowns of Aimed Shot, Multi-Shot, Volley and Arcane
    Shot. It gains most right after Aimed Shot and Multi-Shot have both been used;
    resetting only one still gains that shot.
  based_on:
  - refocus
- key: refocus-trinket-lockout
  when: refocus_shares_trinket_lockout
  text: 'Renataki''s Charm shares a cooldown category with your other on-use trinket:
    using Refocus locks that trinket for 10 s, and using that trinket locks Refocus
    for its own category time.'
  based_on:
  - refocus
encounters: {}
pet: {}
strategy:
  50713:
    retrieved: '2026-10-17'
    source: https://warcraft.wiki.gg/wiki/Viscidus
    items:
    - rule: viscidus-prepare-participation-v1
      section: before
      text: Agree your frost-hit, melee-shatter, glob or healing job and prepare the tools for it. Ordinary DPS does not measure every contribution.
    - rule: viscidus-frost-then-melee-v1
      section: during
      text: Follow the raid's freeze and shatter calls, then the assigned glob target. Static guide hit thresholds do not establish your observed phase or available attacks.
    - rule: viscidus-mage-frost-v1
      section: during
      classes: [4]
      metrics: [dps]
      text: If assigned to freezing, prioritize eligible frost hits; your Fire or Frost ranking category does not itself establish that assignment.
    - rule: viscidus-healing-context-v1
      section: during
      metrics: [hps]
      text: Coordinate poison recovery and healer coverage while others move for shattering; do not leave an assigned healing job merely to copy a damage example.
    - rule: viscidus-raid-coordination-v1
      section: raid
      text: Confirm frost coverage, shatter participation, glob assignments and poison recovery. Pet or guardian contributions require actual ownership and event evidence.
