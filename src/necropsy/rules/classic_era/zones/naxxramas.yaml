# Naxxramas encounter rules (Classic Era).
#
# ranking_exclusions: targets whose damage WCL leaves out of the ranked amount.
#   Not from WCL documentation: found by searching, per boss, for the target set
#   whose removal makes rule external-damage-v1 reproduce the recorded ranked
#   amounts. Validated on the Haplina fixture (2026-10-13): with these
#   exclusions all 90 recorded fights (75 top five + 15 Haplina) match within
#   15 damage. The golden test tests/golden/test_ranking_rules_full.py keeps
#   that validation standing. analysis.json reports this rule as empirical.
# native_targets: the encounter's own units; damage to anything else in the
#   fight is foreign (e.g. trash pulled into the encounter window). Only listed
#   where an analysis needs it.
# start_trash: trash every raid kills at the start of the encounter. Neither
#   the encounter's own units nor padding; reported separately. An empirical
#   classification from the recorded kills, not a documented mechanic.
# boss_game_ids: the boss units themselves; every other hostile NPC is a
#   non-boss target (encounter adds, start trash, pulled-in trash).
version: 1
zone: {id: 2006, name: Naxxramas}
ranking_exclusions_rule:
  rule: naxx-ranking-exclusions-v1
  basis: empirical
  validated: "90/90 recorded fights within 15 damage (Haplina fixture, 2026-10-13)"

encounters:
  - id: 51118
    name: Patchwerk
    boss_game_ids: [16028]
  - id: 51111
    name: Grobbulus
    boss_game_ids: [15931]
  - id: 51108
    name: Gluth
    boss_game_ids: [15932]
    ranking_exclusions:
      - {game_id: 16360, name: Zombie Chow}
  - id: 51120
    name: Thaddius
    boss_game_ids: [15928]
  - id: 51117
    name: Noth the Plaguebringer
    boss_game_ids: [15954]
  - id: 51112
    name: Heigan the Unclean
    boss_game_ids: [15936]
    ranking_exclusions:
      - {game_id: 16036, name: Frenzied Bat}
      - {game_id: 16037, name: Plagued Bat}
  - id: 51115
    name: Loatheb
    boss_game_ids: [16011]
    healing_role_minimum_actions: 1
    healing_restriction: "Corrupted Mind restricts healing opportunities; one or two healing casts can be expected. Review the assigned healing rotation rather than whole-fight cast frequency."
  - id: 51107
    name: Anub'Rekhan
    boss_game_ids: [15956]
    ranking_exclusions:
      - {game_id: 16698, name: Corpse Scarab}
  - id: 51110
    name: Grand Widow Faerlina
    boss_game_ids: [15953]
    ranking_exclusions:
      - {game_id: 16506, name: Naxxramas Worshipper}   # Followers (16505) do count
  - id: 51116
    name: Maexxna
    boss_game_ids: [15952]
  - id: 51113
    name: Instructor Razuvious
    boss_game_ids: [16061]
    ranking_exclusions:
      - {game_id: 16803, name: Death Knight Understudy}
  - id: 51109
    name: Gothik the Harvester
    boss_game_ids: [16060]
    # Gothik's own waves.
    native_targets:
      - {game_id: 16060, name: Gothik the Harvester}
      - {game_id: 16124, name: Unrelenting Trainee}
      - {game_id: 16125, name: Unrelenting Death Knight}
      - {game_id: 16126, name: Unrelenting Rider}
      - {game_id: 16127, name: Spectral Trainee}
      - {game_id: 16137, name: Naxxramas Military Sub-Boss Trigger}
      - {game_id: 16148, name: Spectral Death Knight}
      - {game_id: 16149, name: Spectral Horse}
      - {game_id: 16150, name: Spectral Rider}
    # Present in the first ~50 s of all six recorded kills, the subject's included,
    # with the same damage taken each time (reviewed 2026-10-13).
    start_trash:
      - {game_id: 16449, name: Spirit of Naxxramas}
  - id: 51121
    name: The Four Horsemen
    boss_game_ids: [16062, 16063, 16064, 16065]
  - id: 51119
    name: Sapphiron
    boss_game_ids: [15989]
  - id: 51114
    name: Kel'Thuzad
    boss_game_ids: [15990]

# Metric policies apply only to their exact cell scope. They never validate the
# damage rule above or any other encounter, class, category, metric or faction.
ranking_metric_policies:
- rule: naxx-gothik-balance-druid-dps-v1
  basis: empirical
  scope:
    encounter_id: 51109
    class_id: 2
    category: Balance
    metric: dps
    faction: Alliance
  formula: >-
    WCL DPS equals the actor's damage plus its listed owned units' damage, less
    damage to the actor or its owned units, divided by the fight duration. No
    target exclusions.
  conditions:
  - unique-name-realm-identity
  - complete-source-target-streams
  - owned-unit-listing-present
  - owner-and-owned-unit-targets-subtracted
  - ranking-duration-equals-fight-duration
  - encounter-has-no-production-ranking-exclusions
  bound: Within one unit of the published last decimal place; the upstream rounding mode is not established.
  validated: 4 admitted of 6 in-scope Gothik the Harvester Balance Druid Alliance rows (3 non-subject); 2 ownership refusals, unknown; 0 contradictions.
  evidence: tests/golden/raids/dps-ranking-naxx-gothik-balance-druid.json
