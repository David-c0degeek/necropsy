version: 1
rule: mc-execution-v1
non_boss_share_min_pct: 5.0
general:
- key: one-rapid-fire
  when: kill_within_rapid_fire_cooldown
  text: 'With no cooldown reset, this kill is shorter than Rapid Fire''s cooldown,
    so it allows one use: spend it where it covers the most ranked damage.'
  otherwise: 'This kill is longer than Rapid Fire''s cooldown: a pull use comes back
    before the end, so a second use is possible.'
  based_on:
  - rapid_fire
- key: refocus-after-specials
  text: Refocus clears the cooldowns of Aimed Shot, Multi-Shot, Volley and Arcane
    Shot. It gains most right after Aimed Shot and Multi-Shot have both been used;
    resetting only one still gains that shot.
  based_on:
  - refocus
- key: refocus-trinket-lockout
  when: refocus_shares_trinket_lockout
  text: 'Renataki''s Charm shares a cooldown category with your other on-use trinket:
    using Refocus locks that trinket for 10 s, and using that trinket locks Refocus
    for its own category time.'
  based_on:
  - refocus
encounters: {}
pet: {}
strategy:
  50663:
    retrieved: '2026-10-17'
    source: https://warcraft.wiki.gg/wiki/Lucifron
    items:
    - rule: lucifron-assign-removals-v1
      section: before
      text: Agree who removes curses and magic effects, and who handles the two Protectors. Those jobs can interrupt normal damage or healing.
    - rule: lucifron-resource-cost-v1
      section: during
      text: Lucifron's Curse increases ability resource costs. Coordinate its removal rather than treating reduced activity as a rotation failure.
    - rule: lucifron-decurse-v1
      section: during
      classes: [2, 4]
      text: If assigned to remove curses, preserve time and resources for that job; a damage-only comparison does not measure your decursing contribution.
    - rule: lucifron-magic-removal-v1
      section: during
      classes: [6, 7]
      text: Follow the assigned magic-removal priorities for Impending Doom and controlled players; healing throughput alone does not measure that duty.
    - rule: lucifron-protector-coordination-v1
      section: raid
      text: Confirm Protector tanking and kill order, control recovery and removal priorities before copying another player's target mix.
