strategy:
  50664:
    retrieved: '2026-10-17'
    source: https://warcraft.wiki.gg/wiki/Magmadar
    items:
    - rule: magmadar-placement-and-recovery-v1
      section: before
      text: Agree the tank position, safe recovery routes after Panic and the Hunter rotation for removing Frenzy before the pull.
    - rule: magmadar-prepare-tranquilizing-shot-v1
      section: before
      classes: [3]
      source: https://www.wowhead.com/classic/item=16665/tome-of-tranquilizing-shot
      text: If assigned to Frenzy removal, confirm Tranquilizing Shot is learned and agree who covers an unsuccessful attempt.
    - rule: magmadar-fire-and-fear-v1
      section: during
      text: Recover from Panic without crossing Lava Bomb fire or the boss's frontal attacks. A fear event describes exposure; it does not by itself establish avoidable downtime.
    - rule: magmadar-hunter-utility-v1
      section: during
      classes: [3]
      text: Follow your assigned Tranquilizing Shot rotation. Review successful Frenzy removals separately from casts; a cast alone does not prove the effect was removed.
    - rule: magmadar-healing-context-v1
      section: during
      metrics: [hps]
      text: Plan healing coverage through Panic and Frenzy with the tank and other healers. Whole-fight healing can change with fear exposure and assignments.
    - rule: magmadar-rotation-and-fear-coverage-v1
      section: raid
      text: Coordinate backup Frenzy removal and tank support during fear recovery. Actor logs cannot establish every raid-wide Frenzy opportunity or each player's assignment.
  50663:
    retrieved: '2026-10-17'
    source: https://warcraft.wiki.gg/wiki/Lucifron
    items:
    - rule: lucifron-assign-removals-v1
      section: before
      text: Agree who removes curses and magic effects, and who handles the two Protectors. Those jobs can interrupt normal damage or healing.
    - rule: lucifron-resource-cost-v1
      section: during
      text: Lucifron's Curse increases ability resource costs. Coordinate its removal rather than treating reduced activity as a rotation failure.
    - rule: lucifron-decurse-v1
      section: during
      classes: [2, 4]
      text: If assigned to remove curses, preserve time and resources for that job; a damage-only comparison does not measure your decursing contribution.
    - rule: lucifron-magic-removal-v1
      section: during
      classes: [6, 7]
      text: Follow the assigned magic-removal priorities for Impending Doom and controlled players; healing throughput alone does not measure that duty.
    - rule: lucifron-protector-coordination-v1
      section: raid
      text: Confirm Protector tanking and kill order, control recovery and removal priorities before copying another player's target mix.
