# Metric policies apply only to their exact cell scope. They never validate the
# damage rule above or any other encounter, class, category, metric or faction.
ranking_metric_policies:
- rule: mc-geddon-holy-paladin-hps-v1
  basis: empirical
  scope:
    encounter_id: 50668
    class_id: 6
    category: Holy
    metric: hps
    faction: Alliance
  formula: >-
    WCL HPS equals the actor's heal amounts (overheal excluded) plus its absorbed
    events plus the same for its listed owned units, divided by the fight duration.
    No target exclusions.
  conditions:
  - unique-name-realm-identity
  - complete-source-target-streams
  - owned-unit-listing-present
  - friendly-recipients-only
  - ranking-duration-equals-fight-duration
  bound: Within one unit of the published last decimal place; the upstream rounding mode is not established.
  validated: 6/6 audited Baron Geddon Holy Paladin ranking rows within the bound; 0 contradictions.
  evidence: tests/golden/raids/hps-ranking-geddon-paladin.json
