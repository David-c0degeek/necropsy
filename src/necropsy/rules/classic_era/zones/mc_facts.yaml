rule: mc-encounter-facts-v1
retrieved: '2026-10-17'
encounters:
- id: 50672
  name: Ragnaros
  source: https://www.wowhead.com/classic/guide/ragnaros-molten-core-strategy-wow-classic
  note: Classic Era conditional boss/add and recovery context. Guide schedules, damage gaps and nominal addon timers are not observed phase or vulnerability windows. Seasonal replacements are excluded.
  timings:
  - key: knockback-recovery
    text: Knockbacks create tank pickup and healing coordination work; damage alone does not establish positioning success.
  - key: sons
    text: Sons of Flame create control and mana-user protection work when present. Short kills and missing markers cannot establish a universal phase contract.
- id: 50670
  name: Golemagg the Incinerator
  source: https://www.wowhead.com/classic/guide/golemagg-the-incinerator-molten-core-strategy-wow-classic
  note: Classic Era boss and Core Rager context. Guide disagreements about add death or completion are not implemented as phases or score denominators. Seasonal replacements are excluded.
  timings:
  - key: magma-splash
    text: Magma Splash stacks damage and armor pressure on affected players. Personal state is separate from the debuff state of healing recipients.
  - key: separate-tank-jobs
    text: Golemagg and Core Rager tanking divide assignments; the ranking category and whole-fight throughput do not identify the assigned target.
- id: 50671
  name: Majordomo Executus
  source: https://www.wowhead.com/classic/guide/majordomo-executus-molten-core-strategy-wow-classic
  note: Classic Era add-centric encounter. Observed buff windows retain exact NPC instances. Nominal guide durations and control thresholds do not supply personal opportunities.
  timings:
  - key: magic-reflection
    text: Magic Reflection on adds is distinct from Damage Shield. Only actual recipient transitions establish observed aura state.
  - key: aegis
    text: Aegis of Ragnaros is a caster-self shield and healing effect; it is not the adds' reflection buff.
  - key: control-and-completion
    text: Individual Flamewaker control, tanking and add deaths require separate identities. No guide threshold is an observed immunity or surrender boundary.
- id: 50669
  name: Sulfuron Harbinger
  source: https://www.wowhead.com/classic/guide/sulfuron-harbinger-molten-core-strategy-wow-classic
  note: Classic Era boss and Flamewaker Priest context; seasonal shared health and Dark Mending changes are excluded. Nominal cast times do not establish observed opportunities.
  timings:
  - key: dark-mending
    text: Flamewaker Priests cast Dark Mending to heal allies. Individual targets and successful interrupt effects are needed before assessing assigned interruption.
  - key: separated-tanks
    text: Boss and add positioning divides tank and healing duties. Category and whole-fight throughput do not establish those assignments.
  - key: friendly-magic-removal
    text: Immolate and Shadow Word Pain create friendly magic-removal work separate from healing throughput.
- id: 50667
  name: Shazzrah
  creature_type: Humanoid
  type_source: https://www.wowhead.com/classic/spell=19714/deaden-magic
  source: https://www.wowhead.com/classic/guide/shazzrah-molten-core-strategy-wow-classic
  note: Static Classic Era mechanics; guide timers do not establish observed Blink, Counterspell or boss-buff windows. Seasonal replacements are excluded.
  timings:
  - key: curse
    text: Shazzrah's Curse increases magic damage taken. Personal exposure does not identify who was assigned to remove it.
  - key: deaden-magic
    text: Deaden Magic reduces magical damage taken by the boss and can be removed. Casts and successful removal effects are distinct observations.
  - key: blink-counterspell
    text: Blink and Counterspell can disrupt positioning and casting. An action gap does not by itself establish either mechanic or a lost opportunity.
- id: 50668
  name: Baron Geddon
  creature_type: Elemental
  type_source: https://warcraft.wiki.gg/wiki/Baron_Geddon
  source: https://warcraft.wiki.gg/wiki/Baron_Geddon
  note: Static Classic Era mechanics; personal aura exposure does not establish resource loss, explosion splash, avoidance or a global phase. Season of Mastery multiple-bomb behavior is excluded.
  timings:
  - key: ignite-mana
    text: Ignite Mana burns mana and causes damage when mana is burned. Aura exposure alone does not quantify actual mana loss or damage.
  - key: living-bomb
    text: Living Bomb requires separation from nearby allies. Its application, removal and explosion effects must be distinguished before assessing execution.
  - key: inferno
    text: Inferno creates close-range fire pressure. A guide schedule is not an observed movement or pet-uptime window.
- id: 50665
  name: Gehennas
  creature_type: Humanoid
  type_source: https://www.wowhead.com/classic/pt/npc=12259/geena
  source: https://warcraft.wiki.gg/wiki/Gehennas
  note: Static Classic Era mechanics; a personal curse window is not a raid-wide healing-reduction model. Season of Mastery add counts and cast cadence are excluded.
  timings:
  - key: curse
    text: Gehennas' Curse reduces healing received by the affected target. Personal exposure does not establish the curse state of every healing recipient.
  - key: rain-of-fire
    text: Rain of Fire is a ground hazard. Its damage events do not by themselves establish a complete movement or avoidability window.
- id: 50666
  name: Garr
  creature_type: Elemental
  type_source: https://warcraft.wiki.gg/wiki/Garr
  source: https://warcraft.wiki.gg/wiki/Garr
  note: Classic Era add-control strategies vary; a Warlock category is not proof of a Banish assignment. Season of Mastery Magmakin mechanics are excluded.
  timings:
  - key: firesworn
    text: Firesworn can be assigned to tanks or Banish control. Retain individual NPC instances when reviewing recorded applications.
  - key: eruption
    text: Firesworn explode on death; coordinate positioning and kill order rather than copying a whole-fight damage comparison.
- id: 50664
  name: Magmadar
  creature_type: Beast
  type_source: https://warcraft.wiki.gg/wiki/Magmadar
  source: https://www.wowhead.com/classic/npc=11982/magmadar
  note: Static Classic Era mechanics; nominal timings are not observed opportunities. Seasonal Core Hound spawns do not apply to these Era policies.
  timings:
  - key: frenzy
    text: Frenzy is removed by Tranquilizing Shot; review successful removal effects separately from casts.
  - key: panic
    text: Panic causes fear. An absent aura transition does not establish immunity or a completed fear-handling assignment.
- id: 50663
  name: Lucifron
  source: https://warcraft.wiki.gg/wiki/Lucifron
  note: Static Classic Era mechanics, source retrieved 2026-10-20; guide cadence and the 40-yard debuff range are not observed positions or opportunities. Season of Mastery changes are excluded.
  timings:
  - key: impending-doom
    text: Impending Doom deals Shadow damage after 10 seconds unless removed. Removal effects, not casts, establish who ended an exposure.
  - key: curse
    text: Lucifron's Curse raises the cost of spells and abilities. Personal exposure does not quantify resource lost or identify the assigned decurser.
  - key: dominate-mind
    text: Lucifron's guards can mind control players with Dominate Mind. An absent transition on one actor does not show it was absent raid-wide.
