rule: druid-actions-v2
# English translated WCL ability names. Classification covers actions, not talent trees.
# Unknown names remain in the full timeline and never become negative evidence.
feral:
  - Claw
  - Shred
  - Rake
  - Rip
  - Ferocious Bite
  - Tiger's Fury
balance:
  - Wrath
  - Starfire
  - Moonfire
  - Insect Swarm
healing:
  - Healing Touch
  - Rejuvenation
  - Regrowth
  - Tranquility
tanking:
  - Maul
  - Swipe
  - Swipe (Bear)
  - Growl
  - Challenging Roar
forms:
  Cat Form: cat
  Bear Form: bear
  Dire Bear Form: bear
  Moonkin Form: moonkin
cooldowns:
  - Innervate
  - Nature's Swiftness
  - Nature's Grace
  - Barkskin
  - Frenzied Regeneration
  - Enrage
  - Rebirth
  - Nature's Grasp
  - Faerie Fire
  - Faerie Fire (Feral)
minimum_role_actions: 3
minimum_secondary_cast_share: 0.2
direct_tank_hits:
  - Melee
  - Hateful Strike
