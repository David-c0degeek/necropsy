[project]
name = "necropsy"
version = "0.1.0"
description = "Local-first Warcraft Logs forensics: same-faction benchmarks and offline boss-by-boss playbooks."
readme = "README.md"
authors = [
    { name = "David", email = "David@C0deGeek.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6,<2",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3,<7",
    "typer>=0.27,<0.28",
]

[project.scripts]
necropsy = "necropsy.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
# Plan evidence scripts are disposable notes, not project code.
extend-exclude = ["tasks"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config"]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "golden: needs the full Haplina fixture from Git LFS (run: uv run pytest -m golden)",
    "live: talks to the live Warcraft Logs API with keyring credentials (manual only)",
    "acceptance: milestone acceptance gate over the golden-fact register (run: uv run pytest -m acceptance)",
]
