- rule: naxx-anubrekhan-balance-druid-alliance-dps-v1
  basis: empirical
  scope:
    encounter_id: 51107
    class_id: 2
    category: Balance
    metric: dps
    faction: Alliance
  formula: WCL DPS equals the actor's damage plus its listed owned units' damage, less damage
    to the actor or its owned units and less damage to the encounter's production-excluded
    target game IDs, divided by the fight duration.
  conditions:
  - unique-name-realm-identity
  - complete-source-target-streams
  - owned-unit-listing-present
  - owner-and-owned-unit-targets-subtracted
  - ranking-duration-equals-fight-duration
  - production-ranking-exclusions-exercised
  bound: Within one unit of the published last decimal place; the upstream rounding mode is
    not established.
  validated: 5 admitted of 5 in-scope Anub'Rekhan Balance Druid Alliance rows (5 distinct
    non-subject players, 0 exercising the list); 0 ownership refusals, unknown; 0 contradictions;
    5 boss-level list witnesses. policy-exclusions-20261112.
  evidence: tests/golden/raids/dps-ranking-naxx-anubrekhan-balance-druid-alliance.json
  tested_exclusions:
  - 16698
