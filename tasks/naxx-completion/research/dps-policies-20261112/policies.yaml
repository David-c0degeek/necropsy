  scope:
    encounter_id: 51111
    class_id: 2
    category: Restoration
    metric: hps
    faction: Horde
  formula: WCL HPS equals the actor's heal amounts (overheal excluded) plus its absorbed events
    plus the same for its listed owned units, on friendly recipients, divided by the fight
    duration. No target exclusions.
  conditions:
  - unique-name-realm-identity
  - complete-source-target-streams
  - owned-unit-listing-present
  - friendly-recipients-only
  - ranking-duration-equals-fight-duration
  bound: Within one unit of the published last decimal place; the upstream rounding mode is
    not established.
  validated: 3 admitted of 3 in-scope Grobbulus Restoration Druid Horde rows (3 distinct non-subject
    players); 0 ownership refusals, unknown; 0 contradictions. policy-20261112.
  evidence: tests/golden/raids/hps-ranking-naxx-grobbulus-restoration-druid-horde.json
