- rule: naxx-gothik-balance-druid-horde-dps-v1
  basis: empirical
  scope:
    encounter_id: 51109
    class_id: 2
    category: Balance
    metric: dps
    faction: Horde
  formula: WCL DPS equals the actor's damage plus its listed owned units' damage, less damage
    to the actor or its owned units, divided by the fight duration. No target exclusions.
  conditions:
  - unique-name-realm-identity
  - complete-source-target-streams
  - owned-unit-listing-present
  - owner-and-owned-unit-targets-subtracted
  - ranking-duration-equals-fight-duration
  - encounter-has-no-production-ranking-exclusions
  bound: Within one unit of the published last decimal place; the upstream rounding mode is
    not established.
  validated: 5 admitted of 5 in-scope Gothik the Harvester Balance Druid Horde rows (5 distinct
    non-subject players); 0 ownership refusals, unknown; 0 contradictions. policy-20261112.
  evidence: tests/golden/raids/dps-ranking-naxx-gothik-balance-druid-horde.json
