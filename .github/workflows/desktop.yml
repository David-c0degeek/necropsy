name: Desktop packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "src/necropsy/**"
      - "tests/unit/test_desktop_engine.py"
      - "tests/fixtures/haplina_naxx_subset.zip"
      - "scripts/*desktop*"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  package:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            engine: desktop/src-tauri/binaries/necropsy-engine-x86_64-pc-windows-msvc.exe
          - os: ubuntu-22.04
            bundles: deb,appimage
            engine: desktop/src-tauri/binaries/necropsy-engine-x86_64-unknown-linux-gnu
          - os: macos-15
            bundles: app,dmg
            engine: desktop/src-tauri/binaries/necropsy-engine-aarch64-apple-darwin
          - os: macos-15-intel
            bundles: app,dmg
            engine: desktop/src-tauri/binaries/necropsy-engine-x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf libayatana-appindicator3-dev
      - run: uv sync --locked --group desktop-build
      - run: uv run pytest tests/unit/test_desktop_engine.py -q
      - run: uv run --group desktop-build python scripts/build_desktop.py
      - name: Verify the frozen engine outside the checkout
        run: uv run python scripts/check_desktop_engine.py ${{ matrix.engine }}
      - run: npm ci
        working-directory: desktop
      - run: npm run format:check
        working-directory: desktop
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --locked -- -D warnings
        working-directory: desktop/src-tauri
      - run: npm run package -- --bundles ${{ matrix.bundles }}
        working-directory: desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: necropsy-${{ matrix.os }}
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
